name: Confecciones checks
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/confecciones-check.yml'
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npx vite build
