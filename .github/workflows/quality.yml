name: DocFlow quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/consolidacion-ia-rbac-auditoria]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript frontend and Worker
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Security and audit regression tests
        run: node --test tests/security-regression.test.mjs
